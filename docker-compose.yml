services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: moviedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alexkoba
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-server:
    build:
      context: .
      dockerfile: test/mock-server/Dockerfile
    ports:
      - "9090:9090"
    environment:
      MOCK_PORT: "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5

  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    working_dir: /app
    env_file:
      - .env
    environment:
      KINOPOISK_BASE_URL: http://mock-server:9090/api/v2.2
      YOUTUBE_BASE_URL: http://mock-server:9090/youtube/v3
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      mock-server:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo "=== Unit tests ==="
        go test ./internal/... ./pkg/... ./cmd/... -v -cover

        echo "=== Integration tests ==="
        export API_URL="http://api:${PORT:-8080}"
        go test ./test/integration/... -v -timeout 3m

        echo "=== Done ==="
        exit 0

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mock-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KINOPOISK_BASE_URL: http://mock-server:9090/api/v2.2
      YOUTUBE_BASE_URL: http://mock-server:9090/youtube/v3
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:${PORT:-8080}/health || exit 1",
        ]
      interval: 5s
      timeout: 2s
      retries: 10
    entrypoint:
      - sh
      - -c
      - |
        echo "Waiting for Postgres…"
        until pg_isready -h postgres -U postgres; do sleep 2; done
        echo "Importing movies from MOCK server…"
        /app/import_all_movies || true
        echo "Starting API…"
        exec /app/server

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db_data:
