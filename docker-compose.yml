services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: moviedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alexkoba
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    working_dir: /app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo "=== Unit tests ==="
        go test ./internal/... ./pkg/... ./cmd/... -v -cover

        echo "=== Integration tests ==="
        go test ./test/integration/... -v -timeout 2m

        echo "=== Done ==="
        exit 0

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
    entrypoint:
      - sh
      - -c
      - |
        echo "Waiting for Postgres…"
        until pg_isready -h postgres -U postgres; do sleep 2; done

        echo "Importing movies…"
        /app/import_all_movies || true

        echo "Starting API…"
        exec /app/server

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db_data:
