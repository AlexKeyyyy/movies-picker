name: "CI: System Tests"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: system-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: "System E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install Docker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client

      - name: Create .env for Docker
        run: |
          echo "PORT=8080" > .env
          echo "DB_URL=postgres://postgres:alexkoba@postgres:5432/moviedb?sslmode=disable" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "KINOPOISK_API_KEY=mock-key-not-used" >> .env
          echo "YOUTUBE_API_KEY=mock-key-not-used" >> .env

      - name: Build and start application stack
        run: |
          docker compose down -v
          docker compose build api frontend mock-server
          docker compose up -d postgres mock-server api frontend

      - name: Wait for frontend
        run: |
          for i in {1..90}; do
            if curl -fsS "http://localhost:3000" >/dev/null; then
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
          echo "Frontend did not become ready in time"
          docker compose logs frontend api
          exit 1

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Run system tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color
