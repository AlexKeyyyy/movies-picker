name: "CI: System Tests"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: system-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: "System E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Run unit tests with artifacts
        run: |
          mkdir -p artifacts
          set -o pipefail
          go test ./internal/... ./pkg/... -json -coverprofile=coverage_unit_all 2>&1 | tee artifacts/unit-tests.jsonl
          go tool cover "-func=coverage_unit_all" | tee artifacts/unit-coverage.txt

      - name: Install Docker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client

      - name: Create .env for Docker
        run: |
          echo "PORT=8080" > .env
          echo "DB_URL=postgres://postgres:alexkoba@postgres:5432/moviedb?sslmode=disable" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "KINOPOISK_API_KEY=mock-key-not-used" >> .env
          echo "YOUTUBE_API_KEY=mock-key-not-used" >> .env

      - name: Build and start application stack
        run: |
          docker compose down -v
          docker compose build api frontend mock-server
          docker compose up -d postgres mock-server api frontend

      - name: Wait for frontend
        run: |
          for i in {1..90}; do
            if curl -fsS "http://localhost:3000" >/dev/null; then
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
          echo "Frontend did not become ready in time"
          docker compose logs frontend api
          exit 1

      - name: Run integration tests with artifacts
        env:
          API_URL: http://localhost:8080
          MOCK_SERVER_URL: http://localhost:9090
        run: |
          set -o pipefail
          go test ./test/integration/... -json -timeout 3m 2>&1 | tee artifacts/integration-tests.jsonl

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Run system tests
        working-directory: e2e
        run: npx playwright test

      - name: Generate unified CI test report
        run: |
          python3 scripts/render_ci_test_report.py \
            --unit-json artifacts/unit-tests.jsonl \
            --unit-coverage artifacts/unit-coverage.txt \
            --integration-json artifacts/integration-tests.jsonl \
            --e2e-junit e2e/test-results/results.xml \
            --output report/generated/ci-all-tests-report.html \
            --title "Movies Picker CI Report: Unit + Integration + E2E"

      - name: Add report note to job summary
        run: |
          echo "## Unified Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`all-tests-report\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Playwright artifact: \`playwright-report\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unified test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-tests-report
          path: report/generated/ci-all-tests-report.html
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color
