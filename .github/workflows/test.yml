name: "CI: Unit & Integration Tests"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Download modules
        run: go mod download

      - name: Run unit tests
        run: go test ./internal/... ./pkg/... -v -cover

  integration-tests:
    name: "Integration Tests"
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Download modules
        run: go mod download

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client

      - name: Create .env for Docker
        run: |
          echo "PORT=8080" > .env
          echo "DB_URL=postgres://postgres:alexkoba@postgres:5432/moviedb?sslmode=disable" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "KINOPOISK_API_KEY=mock-key-not-used" >> .env
          echo "YOUTUBE_API_KEY=mock-key-not-used" >> .env

      - name: Build and start base services
        run: |
          docker compose down -v
          docker compose build api mock-server
          docker compose up -d postgres mock-server

      - name: Wait for mock-server
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:9090/health" >/dev/null; then
              echo "Mock server is ready"
              exit 0
            fi
            echo "Waiting for mock-server..."
            sleep 2
          done
          echo "Mock server did not start in time"
          docker compose logs mock-server
          exit 1

      - name: Wait for Postgres container health
        run: |
          for i in {1..60}; do
            STATUS=$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q postgres)" 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
            echo "Waiting for Postgres health... current=$STATUS"
            sleep 2
          done
          echo "Postgres did not become healthy in time"
          docker compose ps
          docker compose logs postgres
          exit 1

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8080/health" >/dev/null; then
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs api
          exit 1

      - name: Run integration tests
        env:
          API_URL: http://localhost:8080
          MOCK_SERVER_URL: http://localhost:9090
        run: go test ./test/integration/... -v -timeout 3m

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color
