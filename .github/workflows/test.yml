name: "CI: Unit & Integration Tests"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Download modules
        run: go mod download

      - name: Run unit tests with artifacts
        run: |
          mkdir -p artifacts
          set -o pipefail
          go test ./internal/... ./pkg/... -json -coverprofile=coverage_unit_all 2>&1 | tee artifacts/unit-tests.jsonl
          go tool cover "-func=coverage_unit_all" | tee artifacts/unit-coverage.txt

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-artifacts
          path: |
            artifacts/unit-tests.jsonl
            artifacts/unit-coverage.txt
          if-no-files-found: error

  integration-tests:
    name: "Integration Tests"
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Download modules
        run: go mod download

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client

      - name: Create .env for Docker
        run: |
          echo "PORT=8080" > .env
          echo "DB_URL=postgres://postgres:alexkoba@postgres:5432/moviedb?sslmode=disable" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "KINOPOISK_API_KEY=mock-key-not-used" >> .env
          echo "YOUTUBE_API_KEY=mock-key-not-used" >> .env

      - name: Build and start base services
        run: |
          docker compose down -v
          docker compose build api mock-server
          docker compose up -d postgres mock-server

      - name: Wait for mock-server
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:9090/health" >/dev/null; then
              echo "Mock server is ready"
              exit 0
            fi
            echo "Waiting for mock-server..."
            sleep 2
          done
          echo "Mock server did not start in time"
          docker compose logs mock-server
          exit 1

      - name: Wait for Postgres container health
        run: |
          for i in {1..60}; do
            STATUS=$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q postgres)" 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
            echo "Waiting for Postgres health... current=$STATUS"
            sleep 2
          done
          echo "Postgres did not become healthy in time"
          docker compose ps
          docker compose logs postgres
          exit 1

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8080/health" >/dev/null; then
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs api
          exit 1

      - name: Run integration tests
        env:
          API_URL: http://localhost:8080
          MOCK_SERVER_URL: http://localhost:9090
        run: |
          mkdir -p artifacts
          set -o pipefail
          go test ./test/integration/... -json -timeout 3m 2>&1 | tee artifacts/integration-tests.jsonl

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: artifacts/integration-tests.jsonl
          if-no-files-found: error

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color

  test-report:
    name: "Generate CI Report"
    needs: [unit-tests, integration-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download unit artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-test-artifacts
          path: artifacts/unit

      - name: Download integration artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-artifacts
          path: artifacts/integration

      - name: Generate HTML report
        run: |
          python3 scripts/render_ci_test_report.py \
            --unit-json artifacts/unit/unit-tests.jsonl \
            --unit-coverage artifacts/unit/unit-coverage.txt \
            --integration-json artifacts/integration/integration-tests.jsonl \
            --output report/generated/ci-unit-integration-report.html \
            --title "Movies Picker CI Report: Unit + Integration"

      - name: Add report note to summary
        run: |
          echo "## CI Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`ci-unit-integration-report\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-integration-report
          path: report/generated/ci-unit-integration-report.html
          if-no-files-found: error
