name: "CI: Unit & Integration Tests"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Download modules
        run: go mod download

      - name: Run unit tests
        run: go test ./internal/... ./pkg/... -v -cover

  integration-tests:
    name: "🔗 Integration Tests"
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client

      - name: Create .env for Docker
        run: |
          echo "PORT=8080" > .env
          echo "DB_URL=postgres://postgres:alexkoba@postgres:5432/moviedb?sslmode=disable" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "KINOPOISK_API_KEY=${{ secrets.KINOPOISK_API_KEY }}" >> .env
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env

      - name: Build and start API & DB
        run: |
          docker compose down -v
          docker compose build api builder
          docker compose up -d postgres api

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..60}; do
            if pg_isready -h localhost -U postgres; then
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Postgres did not become ready in time"
          docker compose logs postgres
          exit 1

      - name: Wait for API healthy
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8080/movies?page=1&size=1" >/dev/null; then
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs api
          exit 1

      - name: Run integration tests
        env:
          API_URL: http://localhost:8080
        run: docker compose run --rm builder

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color
